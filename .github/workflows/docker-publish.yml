name: docker-publish

# Builds and pushes the container image to Docker Hub when a version tag is
# pushed (same trigger as npm publish). Requires two repository secrets:
#   DOCKERHUB_USERNAME — the Docker Hub account/namespace (image becomes
#                        <username>/shinobi)
#   DOCKERHUB_TOKEN    — a Docker Hub access token with Read/Write
# The tag must match package.json's version, so a mismatched release fails here
# the same way it does for the npm publish workflow.

on:
  push:
    tags:
      - 'v*'

# JS actions run on Node 24 (the Node 20 action runtime is deprecated; GitHub
# flips the default on 2026-06-16). Opting in explicitly silences the warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/shinobi
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
