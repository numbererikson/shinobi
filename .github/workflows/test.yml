name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# JS actions run on Node 24 (the Node 20 action runtime is deprecated; GitHub
# flips the default on 2026-06-16). Opting in explicitly silences the warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (triggers prepare → dashboard-spa install + build)
        run: npm ci

      - name: Unit tests (vitest)
        run: npm run test:vitest

      - name: Smoke — direct tool invocation
        run: npm run smoke:tools

      - name: Smoke — MCP stdio transport
        run: npm run smoke:mcp

      - name: Smoke — MCP streamable HTTP transport
        run: npm run smoke:mcp-http

      - name: Smoke — dashboard HTTP endpoints
        run: npm run smoke:dashboard
