name: publish

# Publishes to npm when a version tag is pushed:
#   git tag v0.2.1 && git push origin v0.2.1
# Requires the NPM_TOKEN repository secret (npm automation token).
# The tag must match package.json's version — the guard step enforces it,
# so "bumped but forgot to publish" and "published wrong version" both die in CI.

on:
  push:
    tags:
      - 'v*'

# JS actions run on Node 24 (the Node 20 action runtime is deprecated; GitHub
# flips the default on 2026-06-16). Opting in explicitly silences the warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
