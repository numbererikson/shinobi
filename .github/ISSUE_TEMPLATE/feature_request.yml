name: Feature request
description: Suggest a new capability or improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point. Concrete examples help.
      placeholder: "I'm trying to do X but I have to do Y manually because…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you want this to work? A rough sketch is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you think about? Why don't they work?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New MCP tool
        - Dashboard UI change
        - CLI command
        - Plugin idea (lives in separate package)
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to contribute the implementation?
      options:
        - label: I'd like to try implementing this myself
