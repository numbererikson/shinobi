name: Bug report
description: Something doesn't work as expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you saw
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
      placeholder: Tell us what you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps if possible. Include any commands or input that triggered it.
      placeholder: |
        1. Ran `shinobi ...`
        2. Opened the dashboard
        3. Clicked X
        4. Saw Y instead of Z
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Shinobi version
      description: "Run `shinobi --help` to confirm install; check `~/.shinobi/shinobi.db` mtime or run `git log -1 --oneline` in your checkout."
      placeholder: e.g. main@<commit-sha> or v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: "`node --version`"
      placeholder: e.g. v22.0.0

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any error output from the terminal or dashboard.
      render: shell
